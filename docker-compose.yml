services:
  rabbitmq:
    image: rabbitmq:3-management
    restart: unless-stopped
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-guest}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  auth-db:
    image: postgres:13
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${AUTH_DB_NAME:-ecommerce_auth_database}
      POSTGRES_USER: ${AUTH_DB_USER:-ecommerce_auth_user}
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD:-ecommerce_auth_pass}
    ports:
      - "${AUTH_DB_PORT:-5433}:5432"
    volumes:
      - auth-db-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${AUTH_DB_USER:-ecommerce_auth_user} -d ${AUTH_DB_NAME:-ecommerce_auth_database}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  catalog-db:
    image: postgres:13
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${CATALOG_DB_NAME:-ecommerce_catalog_database}
      POSTGRES_USER: ${CATALOG_DB_USER:-ecommerce_catalog_user}
      POSTGRES_PASSWORD: ${CATALOG_DB_PASSWORD:-ecommerce_catalog_pass}
    ports:
      - "${CATALOG_DB_PORT:-5434}:5432"
    volumes:
      - catalog-db-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${CATALOG_DB_USER:-ecommerce_catalog_user} -d ${CATALOG_DB_NAME:-ecommerce_catalog_database}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  inventory-db:
    image: postgres:13
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${INVENTORY_DB_NAME:-ecommerce_inventory_database}
      POSTGRES_USER: ${INVENTORY_DB_USER:-ecommerce_inventory_user}
      POSTGRES_PASSWORD: ${INVENTORY_DB_PASSWORD:-ecommerce_inventory_pass}
    ports:
      - "${INVENTORY_DB_PORT:-5435}:5432"
    volumes:
      - inventory-db-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${INVENTORY_DB_USER:-ecommerce_inventory_user} -d ${INVENTORY_DB_NAME:-ecommerce_inventory_database}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  auth:
    build:
      # Repo root context: auth depends on packages/auth-middleware (file:../../...)
      context: .
      dockerfile: services/auth/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      AUTH_PORT: "3000"
      JWT_HASH: ${JWT_HASH:?JWT_HASH is required — copy .env.example to .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-24h}
      DATABASE_URL: postgresql://${AUTH_DB_USER:-ecommerce_auth_user}:${AUTH_DB_PASSWORD:-ecommerce_auth_pass}@auth-db:5432/${AUTH_DB_NAME:-ecommerce_auth_database}?schema=public
    ports:
      - "${AUTH_PORT:-3001}:3000"
    depends_on:
      auth-db:
        condition: service_healthy
      rabbitmq:
        condition: service_started

  catalog:
    build:
      # Repo root context: catalog depends on packages/messaging (file:../../...)
      context: .
      dockerfile: services/catalog/Dockerfile
    restart: unless-stopped
    environment:
      CATALOG_PORT: "3000"
      DATABASE_URL: postgresql://${CATALOG_DB_USER:-ecommerce_catalog_user}:${CATALOG_DB_PASSWORD:-ecommerce_catalog_pass}@catalog-db:5432/${CATALOG_DB_NAME:-ecommerce_catalog_database}?schema=public
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:-guest}:${RABBITMQ_DEFAULT_PASS:-guest}@rabbitmq:5672
    ports:
      - "${CATALOG_PORT:-3002}:3000"
    depends_on:
      catalog-db:
        condition: service_healthy
      rabbitmq:
        condition: service_started

  inventory:
    build:
      # Repo root context: inventory depends on packages/messaging (file:../../...)
      context: .
      dockerfile: services/inventory/Dockerfile
    restart: unless-stopped
    environment:
      INVENTORY_PORT: "3000"
      DATABASE_URL: postgresql://${INVENTORY_DB_USER:-ecommerce_inventory_user}:${INVENTORY_DB_PASSWORD:-ecommerce_inventory_pass}@inventory-db:5432/${INVENTORY_DB_NAME:-ecommerce_inventory_database}?schema=public
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:-guest}:${RABBITMQ_DEFAULT_PASS:-guest}@rabbitmq:5672
    ports:
      - "${INVENTORY_PORT:-3005}:3000"
    depends_on:
      inventory-db:
        condition: service_healthy
      rabbitmq:
        condition: service_started

  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    restart: unless-stopped
    environment:
      GATEWAY_PORT: "3000"
      AUTH_SERVICE_URL: http://auth:3000
      CATALOG_SERVICE_URL: http://catalog:3000
      INVENTORY_SERVICE_URL: http://inventory:3000
    ports:
      - "${GATEWAY_PORT:-3000}:3000"
    depends_on:
      - auth
      - catalog
      - inventory

volumes:
  auth-db-data:
  catalog-db-data:
  inventory-db-data:
